<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApplyMate</title>
    <style>
      /* ── Reset & base ─────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --blue:   #2563eb;
        --blue-d: #1d4ed8;
        --green:  #10b981;
        --amber:  #f59e0b;
        --red:    #ef4444;
        --fg:     #111827;
        --fg-2:   #6b7280;
        --fg-3:   #9ca3af;
        --bg:     #ffffff;
        --bg-2:   #f9fafb;
        --border: #e5e7eb;
        --radius: 12px;
      }

      body {
        width: 320px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                     "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }

      /* ── Header ───────────────────────────────────────── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand-icon {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        flex-shrink: 0;
      }
      .brand-name {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.02em;
        color: var(--fg);
      }
      .brand-sub {
        font-size: 10px;
        color: var(--fg-3);
        margin-top: -2px;
      }
      #version {
        font-size: 11px;
        font-weight: 500;
        color: var(--fg-3);
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 7px;
      }

      /* ── Status bar ───────────────────────────────────── */
      .status-bar {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 16px;
        background: var(--bg-2);
        border-bottom: 1px solid var(--border);
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--fg-3);
        transition: background 0.2s;
      }
      .status-dot.ready   { background: var(--green); }
      .status-dot.loading { background: var(--amber); animation: pulse 1s infinite; }
      .status-dot.error   { background: var(--red); }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.4; }
      }
      #status-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--fg-2);
      }

      /* ── Page info card ───────────────────────────────── */
      .section {
        padding: 14px 16px;
      }
      .section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin-bottom: 10px;
      }
      .info-card {
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .info-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
      }
      .info-row + .info-row {
        border-top: 1px solid var(--border);
      }
      .info-icon {
        margin-top: 1px;
        flex-shrink: 0;
        color: var(--fg-3);
      }
      .info-col {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .info-key {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--fg-3);
        margin-bottom: 2px;
      }
      .info-val {
        font-size: 12px;
        color: var(--fg);
        word-break: break-all;
        font-weight: 500;
      }
      #page-url {
        color: var(--blue);
        word-break: break-all;
        font-size: 11px;
      }

      /* ── Footer ───────────────────────────────────────── */
      .footer {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
      }
      .btn-primary:hover { background: var(--blue-d); }
      .btn-ghost {
        background: var(--bg-2);
        color: var(--fg-2);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover { background: var(--border); }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="6" rx="2"/>
            <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">ApplyMate</div>
          <div class="brand-sub">Safari Autofill Assistant</div>
        </div>
      </div>
      <span id="version">v1.0.0</span>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <div id="status-dot" class="status-dot loading"></div>
      <span id="status-label">Connecting…</span>
    </div>

    <!-- Current Page Info -->
    <div class="section">
      <div class="section-label">Current Page Detected</div>
      <div class="info-card">
        <div class="info-row">
          <svg class="info-icon" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
          </svg>
          <div class="info-col">
            <div class="info-key">Page Title</div>
            <div id="page-title" class="info-val">Loading…</div>
          </div>
        </div>

        <div class="info-row">
          <svg class="info-icon" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a14.5 14.5 0 0 1 0 20 14.5 14.5 0 0 1 0-20"/>
            <path d="M2 12h20"/>
          </svg>
          <div class="info-col">
            <div class="info-key">Domain</div>
            <div id="page-host" class="info-val">—</div>
          </div>
        </div>

        <div class="info-row">
          <svg class="info-icon" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <div class="info-col">
            <div class="info-key">Full URL</div>
            <div id="page-url" class="info-val">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer actions -->
    <div class="footer">
      <button class="btn-ghost" id="refresh-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
        Refresh
      </button>
      <button class="btn-primary" id="autofill-btn" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        </svg>
        Autofill (Phase 2)
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
